# sources.yaml — 서지·원문 링크의 단일 원천(single source of truth)
#
# 필드 규칙
#   category        : primary(1차 사료) | scholarship(학술연구) | theory_institutional(이론·제도·방법 해설) | internal(프로젝트 내부 자료: 증거 아님)
#   apa             : README에 그대로 출력되는 APA 7판(고문헌은 APA 응용) 문자열. 제목 부분은 {title_link} 자리표시자로 링크 삽입
#   event_date      : 기록이 다루는 사건의 날짜(음력은 'L' 표기). 사건 날짜 ≠ 편찬 시기
#   source_date     : 문헌이 작성·편찬된 시기. 미확인이면 '확인 필요'
#   url             : 개별 기사/원문 링크. 비어 있으면 url_missing_reason 필수
#   url_check       : tools/check_links.py가 실행 시점에 기록. status ∈ OK | AUTH_REQUIRED | NOT_FOUND | NETWORK_BLOCKED | ERROR | NO_URL | NOT_CHECKED
#   text_verification: 본문(원문) 검증 수준. URL이 열려도 본문을 읽지 않았으면 'URL_ONLY'.
#                      ORIGINAL_VERIFIED | INDIRECT_TRANSCRIPTION(사용자 데이터셋 전사 구절만 확인) | SECONDARY_SUMMARY(사용자 문서의 요약만 확인)
#                      | BIBLIOGRAPHIC_ONLY(서지만, 본문 미열람) | NOT_VERIFIED
#   missing_fields  : APA 필수 요소 중 확인하지 못한 항목(임의로 채우지 않음)
#
# 2026-10-31 실행 환경: 이 세션의 네트워크 정책이 sillok.history.go.kr, db.history.go.kr, sjw.history.go.kr,
# riss.kr, dbpia.co.kr, doi.org, api.crossref.org, fao.org, contents.history.go.kr 를 모두 차단했다(프록시 CONNECT 403).
# 차단은 '자료 부재'가 아니다. 모든 외부 원문 검증은 '검증 미완료'로 남긴다.

sources:

